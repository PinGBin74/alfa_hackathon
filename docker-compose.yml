services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-alfa_news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfa} -d ${POSTGRES_DB:-alfa_news}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5435:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: ""   # адрес собирается из POSTGRES_* (.env), см. backend/app/config.py
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: ""   # адрес собирается из POSTGRES_* (.env), см. backend/app/config.py
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.ingestion.scheduler

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3003:80"


volumes:
  pgdata:
